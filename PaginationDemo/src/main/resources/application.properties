spring.application.name=PaginationDemo

# PostgreSQL (run `docker compose up -d` to start it locally)
spring.datasource.url=jdbc:postgresql://localhost:5432/paginationdemo
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=paginationdemo
spring.datasource.password=paginationdemo

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
