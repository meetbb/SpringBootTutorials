# Tests use in-memory H2 so they don't require Postgres/Docker to be running.
spring.datasource.url=jdbc:h2:mem:urlshortener-test
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# No Redis in tests — caching disabled so tests don't require it running.
spring.cache.type=none
