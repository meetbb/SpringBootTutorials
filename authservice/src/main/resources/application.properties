spring.application.name=authservice

# PostgreSQL (run `docker compose up -d` to start it locally)
spring.datasource.url=jdbc:postgresql://localhost:5432/authservice
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=authservice
spring.datasource.password=authservice

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis (run `docker compose up -d` to start it locally)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT (dev-only secret — use a real secrets manager / env var in production)
jwt.secret=wJrvSF6kTfVdTAwRQd7z3e+IkQuPyYF9NfR/dVWox1I=
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000
